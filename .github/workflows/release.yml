name: release
# Builds, packs and gates mica-podman for amd64 and arm64 on native runners; a
# push to main then releases those gated archives as the GitHub Release
# build-<commit12> of this repository (tools/release.sh).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  # A push run is never cancelled, so a publication is not stopped halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  pin-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pin check against recorded upstream responses
        run: make podman-pins-test
      - name: Ask the six upstreams for their newest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make podman-pins
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Offline checks
        run: make check
  package:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      MICA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: The pinned mica-build-env release
        run: make build-env
      - name: The engine
        run: make podman
      - name: Pack
        run: make deb
      - name: Gate, with a no-cache rebuild
        run: bash tests/package-gate.sh --arch "$MICA_ARCH" --reproduce
      - uses: actions/upload-artifact@v7
        with:
          name: mica-podman-${{ matrix.arch }}
          path: _out/debs/${{ matrix.arch }}/*.deb
          if-no-files-found: error
  gate:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mica-podman-*
          path: _out/artifacts
      - name: Gate over both architectures
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "_out/debs/$arch"
            cp "_out/artifacts/mica-podman-$arch/"*.deb "_out/debs/$arch/"
          done
          bash tests/package-gate.sh
  publish:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-mica-podman
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mica-podman-*
          path: _out/artifacts
      - name: The gated archives of this run
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "_out/debs/$arch"
            cp "_out/artifacts/mica-podman-$arch/"*.deb "_out/debs/$arch/"
          done
          rm -rf _out/artifacts
          bash tests/package-gate.sh
      - name: Release the archives and download them back anonymously
        run: bash tools/release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
