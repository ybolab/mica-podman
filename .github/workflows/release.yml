name: release
# Builds, packs and gates mica-podman for amd64 and arm64 on native runners and
# keeps the archives as workflow artifacts. Publication is not wired yet.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pin-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin check against recorded upstream responses
        run: make podman-pins-test
      - name: Ask the six upstreams for their newest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make podman-pins
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline checks
        run: make check
  package:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      MICA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: The pinned mica-build-env release
        run: make build-env
      - name: The engine
        run: make podman
      - name: Pack
        run: make deb
      - name: Gate, with a no-cache rebuild
        run: bash tests/package-gate.sh --arch "$MICA_ARCH" --reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: mica-podman-${{ matrix.arch }}
          path: _out/debs/${{ matrix.arch }}/*.deb
          if-no-files-found: error
  gate:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mica-podman-*
          path: _out/artifacts
      - name: Gate over both architectures
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "_out/debs/$arch"
            cp "_out/artifacts/mica-podman-$arch/"*.deb "_out/debs/$arch/"
          done
          bash tests/package-gate.sh
