name: release
# Manual only; nothing here runs on a push. Dispatched on main: the build is
# checked, packed and gated for both architectures, then tools/release.sh
# releases those archives as the GitHub Release <YYYYMMDD-HHMM> (UTC) tagged
# at the commit, and reads it back with no credential.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatched on main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "error: release runs on main, not $REF" >&2; exit 1; }'
  build:
    needs: main
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: mica-podman-*
          path: _out/artifacts
      - name: The gated archives of this run
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "_out/debs/$arch"
            cp "_out/artifacts/mica-podman-$arch/"*.deb "_out/debs/$arch/"
          done
          rm -rf _out/artifacts
          bash tests/package-gate.sh
      - name: Release the archives and download them back anonymously
        run: bash tools/release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
