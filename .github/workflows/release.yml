name: release
# Every push to main that passes the gates publishes the pool as the GitHub
# Release build-<commit12> of this commit; the assembly pins that release
# through deps/packages/mica-podman.json. The seven binaries are compiled
# here for both architectures (arm64 under emulation), which is the slow
# part of this workflow and the reason it runs only on main.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the build substrate at its pin
        run: make deps
        env:
          GH_TOKEN: ${{ secrets.MICA_DEPS_TOKEN }}
      - name: Offline checks
        run: make check
      - name: Emulation for the arm64 builder family
        uses: docker/setup-qemu-action@v3
      - name: Builder images, both architectures
        run: |
          set -euo pipefail
          make build-env
          MOS_BUILD_PLATFORM=linux/arm64 make build-env
      - name: The engine, both architectures
        run: |
          set -euo pipefail
          MOS_ARCH=amd64 make podman
          MOS_ARCH=arm64 make podman
      - name: Pack and gate
        run: |
          set -euo pipefail
          make pool
          make package-gate
      - name: Publish the release of this commit
        if: github.event_name == 'push'
        run: make publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
