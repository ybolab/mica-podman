# Image registries. mos's own, not containers-common's.

# Short names ("nginx") resolve against this list. Fully-qualified references
# ("docker.io/library/nginx:1.27") bypass it entirely and are what
# docs/design/containers.md recommends for anything that must boot unattended.
unqualified-search-registries = ["docker.io"]

# "disabled" — do not prompt, resolve against the list above.
#
# The alternative that looks stricter is a trap here. From the field's own
# documentation (vendor/go.podman.io/image/v5/pkg/sysregistriesv2/
# system_registries_v2.go:246):
#
#   "prompt":    prompt if stdout is a TTY, otherwise use all
#                unqualified-search registries
#   "enforcing": always prompt AND ERROR IF STDOUT IS NOT A TTY
#   "disabled":  do not prompt and potentially use all unqualified-search
#                registries
#
# A Quadlet-generated unit is a systemd service. It has no TTY. "enforcing"
# would therefore fail every short-name pull at boot, on a device with no one
# to answer the prompt it insists on.
short-name-mode = "disabled"
