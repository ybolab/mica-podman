# Container image and layer storage.
#
# WHY THIS FILE EXISTS AT ALL. podman ships no storage.conf and falls back to
# built-in defaults: graphroot /var/lib/containers/storage, runroot
# /run/containers/storage. Persistent container content lives under /mos;
# runtime mounts and process state remain volatile under /run.
# /mos/containers is a dedicated bind of DATA/containers, project 102.
[storage]
driver = "overlay"
graphroot = "/mos/containers/storage"
runroot = "/run/containers/storage"

[storage.options]
# The kernel has CONFIG_OVERLAY_FS=y (boards/cx3576/bsp/kernel/config, measured
# 2026-08-23), so the native driver is used and fuse-overlayfs is neither
# installed nor needed -- it is a rootless-mode component, and this design
# does not build rootless.
[storage.options.overlay]
mountopt = "nodev"
